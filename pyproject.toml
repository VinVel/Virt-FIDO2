[project]
name = "virt-fido2"
version = "0.1.4"
description = "A TPM-backed virtual FIDO2 passkey authenticator for Linux"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later AND GPL-2.0-or-later"
license-files = ["LICENSE", "libs/hid-tools/COPYING"]
authors = [{ name = "VinVel" }]
keywords = ["fido2", "webauthn", "passkeys", "tpm2", "linux", "authenticator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "dbus-fast>=5.0.25",
    "fido2>=2.2.1",
    "parse>=1.22.2",
    "pyroute2>=0.9.6",
    "pystemd>=0.15.3",
    "rich>=15.0.0",
    "tpm2-pytss>=3.0.0",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://github.com/VinVel/Virt-FIDO2"
Repository = "https://github.com/VinVel/Virt-FIDO2"
Issues = "https://github.com/VinVel/Virt-FIDO2/issues"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[project.scripts]
virt-fido2 = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = [".", "libs/hid-tools"]

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "src"]

[tool.hatch.build.targets.wheel.force-include]
"libs/hid-tools/hidtools" = "hidtools"

[tool.hatch.build.targets.sdist]
only-include = [
    "main.py",
    "src",
    "libs/hid-tools/hidtools",
    "libs/hid-tools/COPYING",
    "tests",
]

[tool.ty.src]
exclude = ["libs/hid-tools"]

[tool.ty.environment]
extra-paths = ["libs/hid-tools"]

[tool.ruff]
extend-exclude = ["libs/hid-tools"]
