[project]
name = "virt-fido2"
version = "0.1.2"
description = "A TPM-backed virtual FIDO2 passkey authenticator for Linux"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "VinVel" }]
keywords = ["fido2", "webauthn", "passkeys", "tpm2", "linux", "authenticator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "dbus-fast>=5.0.25",
    "fido2>=2.2.1",
    "hid-tools[uhid]>=0.12",
    "pystemd>=0.15.3",
    "rich>=15.0.0",
    "tpm2-pytss>=3.0.0",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://github.com/VinVel/Virt-FIDO2"
Repository = "https://github.com/VinVel/Virt-FIDO2"
Issues = "https://github.com/VinVel/Virt-FIDO2/issues"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[project.scripts]
virt-fido2 = "main:main"

[tool.setuptools]
packages = ["src", "src.assets"]
py-modules = ["main"]

[tool.setuptools.package-data]
"src.assets" = ["*.policy", "*.rules"]
