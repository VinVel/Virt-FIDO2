[project]
name = "virt-fido2"
version = "0.1.0"
description = "A TPM-backed virtual FIDO2 passkey authenticator for Linux"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbus-fast>=5.0.25",
    "fido2>=2.2.1",
    "hid-tools[uhid]>=0.12",
    "pystemd>=0.15.3",
    "rich>=15.0.0",
    "tpm2-pytss>=3.0.0",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[project.scripts]
virt-fido2 = "main:main"

[tool.setuptools]
packages = ["src", "src.assets"]
py-modules = ["main"]

[tool.setuptools.package-data]
"src.assets" = ["*.policy", "*.rules"]
